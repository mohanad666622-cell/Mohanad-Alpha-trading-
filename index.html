<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="MAT"/>
<meta name="theme-color" content="#0d0d0d"/>
<title>Mohanad Alpha Trading</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0d0d0d; --bg2:#161616; --bg3:#1e1e1e; --bg4:#252525;
  --border:#2e2e2e; --border2:#3a3a3a;
  --white:#ffffff; --light:#e8e8e8; --mid:#a0a0a0; --dim:#666;
  --green:#00e676; --green2:#00c853; --greenBg:#00e67612;
  --red:#ff5252;   --red2:#ff1744;   --redBg:#ff525212;
  --yellow:#ffd740; --yellowBg:#ffd74012;
  --orange:#ff6d00; --orangeBg:#ff6d0012;
  --silver:#c8c8c8; --silverBg:#c8c8c812;
  --blue:#448aff;
  --ar:'Cairo',sans-serif; --en:'Orbitron',monospace;
  --r:14px; --r2:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--light);font-family:var(--ar);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;outline:none;background:none;font-family:var(--ar)}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes eye{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes countUp{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}

.fade{animation:fadeUp .35s ease both}

/* ── HEADER ── */
.hdr{
position:sticky;top:0;z-index:100;
background:rgba(13,13,13,.95);
border-bottom:1px solid var(–border);
padding:14px 18px;
padding-top:max(14px,env(safe-area-inset-top));
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo-wrap{display:flex;align-items:center;gap:12px}
.logo-ico{
width:44px;height:44px;border-radius:12px;
background:linear-gradient(135deg,#1e1e1e,#2a2a2a);
border:1px solid var(–border2);
display:flex;align-items:center;justify-content:center;
flex-shrink:0;font-size:22px;
}
.hdr-title{font-family:var(–en);font-size:12px;font-weight:700;color:var(–white);letter-spacing:1px}
.hdr-sub{font-size:11px;color:var(–mid);margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.time-display{text-align:left}
.time-clock{font-family:var(–en);font-size:16px;font-weight:700;color:var(–white)}
.mkt-badge{
display:inline-flex;align-items:center;gap:5px;
padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;
margin-top:4px;
}
.mkt-open{background:var(–greenBg);color:var(–green);border:1px solid #00e67630}
.mkt-closed{background:var(–redBg);color:var(–red);border:1px solid #ff525230}
.dot{width:6px;height:6px;border-radius:50%;animation:blink 1.5s infinite}

.lang-btn{
height:36px;padding:0 14px;border-radius:20px;font-size:12px;font-weight:700;
border:1px solid var(–border2);color:var(–silver);
transition:all .2s;
}
.lang-btn:active{background:var(–bg3)}

/* ── TICKER ── */
.ticker{background:var(–bg2);border-bottom:1px solid var(–border);padding:8px 0;overflow:hidden;white-space:nowrap}
.ticker-track{display:inline-block;animation:shimmer 30s linear infinite;font-size:12px}
.ticker-track{animation:none}
.ticker-scroll{display:inline-block;animation:scroll-left 40s linear infinite}
@keyframes scroll-left{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}

/* ── BOTTOM NAV ── */
.bnav{
position:fixed;bottom:0;left:0;right:0;z-index:100;
background:rgba(13,13,13,.97);border-top:1px solid var(–border);
display:flex;padding-bottom:env(safe-area-inset-bottom,0);
backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.nav-item{
flex:1;display:flex;flex-direction:column;align-items:center;
justify-content:center;padding:10px 4px;gap:4px;
color:var(–dim);transition:color .2s;min-height:58px;
position:relative;
}
.nav-item.on{color:var(–white)}
.nav-item.on::before{
content:’’;position:absolute;top:0;left:20%;right:20%;
height:2px;background:var(–silver);border-radius:0 0 3px 3px;
}
.nav-icon{font-size:24px;line-height:1}
.nav-label{font-size:9px;font-weight:600;letter-spacing:.3px}

/* ── MAIN ── */
.main{padding:18px 16px 90px}

/* ── SECTION TITLE ── */
.sec{
font-size:12px;font-weight:700;color:var(–mid);letter-spacing:2px;
text-transform:uppercase;margin-bottom:14px;
display:flex;align-items:center;gap:10px;
}
.sec::after{content:’’;flex:1;height:1px;background:var(–border)}

/* ── CARDS ── */
.card{
background:var(–bg2);border:1px solid var(–border);
border-radius:var(–r);padding:20px;margin-bottom:14px;
}
.card-sm{padding:16px;border-radius:var(–r2);margin-bottom:12px}

/* ── HERO STAT ── */
.hero{
background:linear-gradient(135deg,var(–bg2),var(–bg3));
border:1px solid var(–border2);border-radius:20px;
padding:24px 20px;text-align:center;margin-bottom:18px;
position:relative;overflow:hidden;
}
.hero::before{
content:’’;position:absolute;inset:0;
background:radial-gradient(ellipse at 50% -20%,rgba(200,200,200,.06),transparent 60%);
}
.hero-label{font-size:12px;color:var(–mid);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.hero-amount{font-family:var(–en);font-size:42px;font-weight:900;color:var(–white);line-height:1;animation:countUp .6s ease}
.hero-pnl{font-size:18px;font-weight:700;margin-top:8px}
.hero-desc{font-size:12px;color:var(–mid);margin-top:6px}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{
background:var(–bg2);border:1px solid var(–border);border-radius:var(–r2);
padding:14px 10px;text-align:center;
}
.stat-num{font-family:var(–en);font-size:18px;font-weight:900;margin-bottom:4px;line-height:1}
.stat-label{font-size:10px;color:var(–mid);letter-spacing:.5px}
.stat-chg{font-size:11px;font-weight:600;margin-top:3px}

/* ── BIG BUTTONS ── */
.big-btn{
display:flex;align-items:center;gap:14px;
width:100%;padding:18px 20px;border-radius:var(–r);
border:1px solid var(–border);margin-bottom:12px;
background:var(–bg2);text-align:right;
transition:all .18s;position:relative;overflow:hidden;
}
.big-btn:active{transform:scale(.98);background:var(–bg3)}
.big-btn-icon{font-size:32px;flex-shrink:0}
.big-btn-body{flex:1;min-width:0}
.big-btn-title{font-size:16px;font-weight:700;color:var(–white);margin-bottom:3px}
.big-btn-sub{font-size:12px;color:var(–mid);line-height:1.5}
.big-btn-pnl{font-family:var(–en);font-size:18px;font-weight:900;flex-shrink:0}
.big-btn-arrow{font-size:20px;color:var(–dim);flex-shrink:0}

/* ── TRADE CARD ── */
.trade{
background:var(–bg2);border:1px solid var(–border);
border-radius:var(–r);padding:20px;margin-bottom:14px;
border-right:4px solid transparent;
}
.trade-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.trade-info{}
.trade-ticker{font-family:var(–en);font-size:24px;font-weight:900;color:var(–white)}
.trade-name{font-size:13px;color:var(–mid);margin-top:3px}
.trade-alloc{font-size:12px;color:var(–dim);margin-top:2px}
.trade-right{text-align:left}
.trade-price{font-family:var(–en);font-size:22px;font-weight:900;color:var(–white)}
.trade-day{font-size:12px;font-weight:600;margin-top:3px}

/* STATUS BADGE */
.status-badge{
display:inline-flex;align-items:center;gap:5px;
padding:6px 14px;border-radius:20px;
font-size:12px;font-weight:700;margin-top:6px;
}

/* DATA TABLE */
.data-table{width:100%;border-collapse:collapse;margin:14px 0}
.data-table th{
padding:10px 12px;background:var(–bg3);
color:var(–mid);font-size:11px;font-weight:600;
letter-spacing:.5px;text-align:right;
border-bottom:1px solid var(–border);
}
.data-table td{
padding:12px;border-bottom:1px solid var(–border);
font-size:13px;font-weight:600;
}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(–bg3)}

/* PROGRESS TRACK */
.prog-wrap{margin:16px 0 4px}
.prog-labels{
display:flex;justify-content:space-between;
font-size:10px;color:var(–mid);margin-bottom:7px;
}
.prog-track{
height:10px;background:var(–bg3);border-radius:5px;
position:relative;overflow:visible;
}
.prog-fill{height:100%;border-radius:5px;transition:width .8s ease}
.prog-pin{
position:absolute;top:-4px;bottom:-4px;width:6px;
border-radius:3px;transform:translateX(-50%);
box-shadow:0 0 10px currentColor;
transition:left .8s ease;
}

/* THESIS BOX */
.thesis{
background:var(–bg3);border-radius:var(–r2);
padding:14px;margin-top:14px;
}
.thesis-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;font-size:13px;line-height:1.7}
.thesis-row:last-child{margin-bottom:0}

/* CHART */
.chart-wrap{position:relative;margin:14px 0 4px}
canvas{display:block;width:100%!important}

/* FILTER TABS */
.filter-row{display:flex;gap:8px;margin-bottom:16px}
.filter-btn{
flex:1;height:42px;border-radius:10px;font-size:13px;font-weight:600;
border:1px solid var(–border);color:var(–mid);
transition:all .2s;
}
.filter-btn.on{
background:var(–bg3);color:var(–white);border-color:var(–border2);
}

/* REPORT ROWS */
.report-row{
display:flex;align-items:center;gap:14px;
padding:16px 18px;border-radius:var(–r);
border:1px solid var(–border);background:var(–bg2);
margin-bottom:10px;width:100%;text-align:right;
transition:all .2s;
}
.report-row:active{background:var(–bg3)}
.report-row-icon{font-size:28px;flex-shrink:0}
.report-row-body{flex:1}
.report-row-title{font-size:15px;font-weight:700;color:var(–white)}
.report-row-sub{font-size:12px;color:var(–mid);margin-top:2px}
.report-row-arrow{font-size:22px;color:var(–dim);margin-right:auto;flex-shrink:0}

/* ROBOT */
.robot-wrap{display:flex;flex-direction:column;align-items:center;padding:16px 0 8px}
.robot-svg{animation:float 4s ease-in-out infinite}

/* LOADING */
.loader{
display:flex;flex-direction:column;align-items:center;
justify-content:center;min-height:100vh;gap:22px;padding:24px;
}
.ring{
width:56px;height:56px;border:3px solid var(–border);
border-top:3px solid var(–silver);border-radius:50%;
animation:spin .9s linear infinite;
}
.boot-box{
width:100%;max-width:360px;background:var(–bg2);
border:1px solid var(–border);border-radius:var(–r);
padding:18px;font-family:monospace;font-size:12px;
}
.bl{color:var(–dim);margin-bottom:4px;animation:fadeUp .2s ease both}
.bl.g{color:var(–green)}.bl.r{color:var(–red)}.bl.w{color:var(–white)}

/* SEP */
.sep{height:1px;background:var(–border);margin:14px 0}

/* EMPTY */
.empty{text-align:center;padding:50px 20px;color:var(–dim)}
.empty-icon{font-size:52px;margin-bottom:16px;opacity:.5}

/* COLORS */
.g{color:var(–green)!important} .r{color:var(–red)!important}
.y{color:var(–yellow)!important} .w{color:var(–white)!important}
.m{color:var(–mid)!important}
</style>

</head>
<body>

<script type="text/babel">
const{useState,useEffect,useCallback,useRef,useMemo}=React;

/* ══════════ TRANSLATIONS ══════════ */
const T={
ar:{
title:“محمد ألفا تريدنج”,sub:“محاكاة الصفقات • بيانات حية”,
overview:“الرئيسية”,alpha:“ألفا”,turbo:“تيربو”,scanner:“السوق”,reports:“تقارير”,
open:“مفتوح”,closed:“مغلق”,

},

title:“Mohanad Alpha Trading”,sub:“Trade Simulation • Live Data”,
overview:“Home”,alpha:“Alpha”,turbo:“Turbo”,scanner:“Market”,reports:“Reports”,
open:“OPEN”,closed:“CLOSED”,
capital:“Capital”,totalPnl:“Total P&L”,
allTrades:“All”,openTrades:“Open”,closedTrades:“Closed”,
entry:“Entry”,stop:“Stop Loss”,t1:“Target 1”,t2:“Target 2”,
current:“Current”,pnl:“P&L ($)”,pnlPct:“P&L (%)”,
toTarget:“To Target”,rr:“R:R”,duration:“Duration”,alloc:“Alloc”,

portfolioA:“Alpha Portfolio — Moderate”,portfolioT:“Turbo Portfolio — Aggressive”,
botA_title:“ALPHA BOT”,botA_desc:“Moderate risk • Swing 3-14 days • Follows analysis”,
botT_title:“TURBO BOT”,botT_desc:“High risk • Fewer trades • Max capital growth”,
}
};

/* ══════════ SETUPS ══════════ */
const SETUPS={
alpha:[
{ticker:“ORCL”,name:“Oracle”,entry:163,stop:153,t1:190,t2:210,riskPct:6,alloc:40,duration:“7-14 يوم”,
thesis_ar:“أرباح Q3 قوية + OCI +84% + تراجع 52% من القمة — مستوى قيمة ممتاز”,
thesis_en:“Strong Q3 + OCI+84% + down 52% from peak — excellent value level”,
risk_ar:“الفيد المتشدد قد يؤخر الارتداد”,risk_en:“Hawkish Fed may delay recovery”},
{ticker:“LRCX”,name:“Lam Research”,entry:235,stop:218,t1:258,t2:268,riskPct:5,alloc:35,duration:“5-10 أيام”,
thesis_ar:“إضافة S&P100 + معدات HBM لنمو AI + تراجع مبالغ فيه”,
thesis_en:“S&P100 addition + HBM equipment for AI growth + oversold”,
risk_ar:“تراجع MU يسحبه للأسفل”,risk_en:“MU pullback drags it lower”},
{ticker:“DAL”,name:“Delta Air Lines”,entry:54.5,stop:51,t1:61,t2:64,riskPct:5,alloc:25,duration:“3-7 أيام”,
thesis_ar:“رفع توجيهات Q1 رسمياً + قطاع السفر لم يُسعَّر بعد”,
thesis_en:“Q1 guidance officially raised + travel sector not yet priced”,
risk_ar:“ارتفاع أسعار النفط يضغط الهامش”,risk_en:“Oil price spike crushes margin”},
],
turbo:[
{ticker:“MU”,name:“Micron Technology”,entry:95,stop:87,t1:108,t2:120,riskPct:8,alloc:60,duration:“2-5 أيام”,
thesis_ar:“أرباح FQ2 قادمة — HBM 100% مباع — نمو AI Memory متسارع”,
thesis_en:“FQ2 earnings upcoming — HBM 100% sold — accelerating AI Memory growth”,
risk_ar:“Buy rumor sell news بعد الإعلان”,risk_en:“Buy rumor sell news after announcement”},
{ticker:“AMD”,name:“Advanced Micro Devices”,entry:116,stop:108,t1:135,t2:148,riskPct:7,alloc:40,duration:“5-10 أيام”,
thesis_ar:“موجة رقائق AI + يتبع قوة MU + تراجع مبالغ فيه من القمة”,
thesis_en:“AI chip wave + MU coattail + severely oversold from peak”,
risk_ar:“ضعف MU يسحب AMD معه”,risk_en:“MU weakness pulls AMD down”},
],
};

const ALL_TK=[…new Set([…SETUPS.alpha.map(s=>s.ticker),…SETUPS.turbo.map(s=>s.ticker),“SPY”,“QQQ”,“NVDA”,“AMAT”])];
const PORT=300;

/* ══════════ UTILS ══════════ */
const ryd=()=>new Date(new Date().toLocaleString(“en-US”,{timeZone:“Asia/Riyadh”}));
const fTs=d=>d.toLocaleTimeString(“en-US”,{hour:“2-digit”,minute:“2-digit”,hour12:false});
const f$=n=>n==null?”—”:”$”+Number(n).toFixed(2);
const fp=n=>n==null?”—”:(n>=0?”+”:””)+Number(n).toFixed(2)+”%”;
const clr=n=>n==null?“var(–mid)”:n>=0?“var(–green)”:“var(–red)”;

/* ══════════ PRICE FETCH ══════════ */
const PROXY=“https://api.allorigins.win/get?url=”;
const YF=“https://query1.finance.yahoo.com/v8/finance/chart/”;

async function fetchOne(tk){
try{
const url=encodeURIComponent(`${YF}${tk}?interval=1m&range=1d`);
const r=await fetch(PROXY+url,{signal:AbortSignal.timeout(9000)});
if(!r.ok)throw new Error();
const d=JSON.parse((await r.json()).contents);
const m=d?.chart?.result?.[0]?.meta;
if(!m)throw new Error();
return{tk,price:m.regularMarketPrice,prev:m.chartPreviousClose||m.previousClose,
high:m.regularMarketDayHigh,low:m.regularMarketDayLow,vol:m.regularMarketVolume};
}catch{return{tk,price:null}}
}
async function fetchAll(){
const res=await Promise.allSettled(ALL_TK.map(fetchOne));
const map={};
res.forEach(r=>{if(r.status===“fulfilled”&&r.value)map[r.value.tk]=r.value});
return map;
}

/* ══════════ PORTFOLIO CALC ══════════ */
function calcPort(setups,prices){
return setups.map((s,i)=>{
const p=prices[s.ticker];
const cur=p?.price;
const amt=Math.round(PORT*s.alloc/100);
const shr=cur?+(amt/s.entry).toFixed(3):null;
let pnlUSD=null,pnlPct=null,st=“PENDING”;
if(cur&&shr){
pnlUSD=+((cur-s.entry)*shr).toFixed(2);
pnlPct=+((cur-s.entry)/s.entry*100).toFixed(2);
if(cur<=s.stop)st=“STOPPED”;
else if(cur>=s.t2)st=“TARGET2”;
else if(cur>=s.t1)st=“TARGET1”;
else if(pnlPct>0.5)st=“PROFIT”;
else if(pnlPct<-0.5)st=“LOSS”;
else st=“FLAT”;
}
const dayChg=(cur&&p.prev)?((cur-p.prev)/p.prev*100):null;
const maxProfit=+((s.t1-s.entry)/s.entry*100).toFixed(1);
const rr=+((s.t1-s.entry)/(s.entry-s.stop)).toFixed(2);
const toTarget=cur?+((s.t1-cur)/cur*100).toFixed(2):null;
return{…s,cur,amt,shr,pnlUSD,pnlPct,st,dayChg,maxProfit,rr,toTarget};
});
}

/* ══════════ SPARKLINE CHART ══════════ */
function MiniChart({values=[],color=“var(–green)”,height=50}){
const ref=useRef();
useEffect(()=>{
const canvas=ref.current;if(!canvas||!values.length)return;
const ctx=canvas.getContext(“2d”);
const W=canvas.offsetWidth,H=height;
canvas.width=W*2;canvas.height=H*2;ctx.scale(2,2);
const min=Math.min(…values),max=Math.max(…values);
const range=max-min||1;
ctx.clearRect(0,0,W,H);
const grad=ctx.createLinearGradient(0,0,0,H);
grad.addColorStop(0,color.replace(”)”,”, .3)”).replace(“var(–green)”,“rgba(0,230,118,.3)”).replace(“var(–red)”,“rgba(255,82,82,.3)”));
grad.addColorStop(1,“rgba(0,0,0,0)”);
ctx.beginPath();
values.forEach((v,i)=>{
const x=(i/(values.length-1))*W;
const y=H-(((v-min)/range)*(H-8)+4);
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
});
ctx.strokeStyle=color.replace(“var(–green)”,”#00e676”).replace(“var(–red)”,”#ff5252”).replace(“var(–silver)”,”#c8c8c8”);
ctx.lineWidth=2;ctx.lineJoin=“round”;ctx.stroke();
const lastX=(W),lastY=H-(((values[values.length-1]-min)/range)*(H-8)+4);
ctx.lineTo(lastX,H);ctx.lineTo(0,H);ctx.closePath();
ctx.fillStyle=grad;ctx.fill();
},[values,color,height]);
return <canvas ref={ref} style={{width:“100%”,height:height+“px”,display:“block”}}/>;
}

            <div className="big-btn-sub">{aPort.length} {lang==="ar"?"صفقات":"trades"} • ${PORT}</div>
          </div>
          <div className="big-btn-pnl" style={{color:clr(tPnlA)}}>
            {tPnlA>=0?"+":""}${Math.abs(tPnlA).toFixed(0)}
          </div>
          <div className="big-btn-arrow">›</div>
        </button>
        <button className="big-btn" style={{borderRight:"4px solid var(--orange)"}} onClick={()=>setTab("turbo")}>
          <div className="big-btn-icon">⚡</div>
          <div className="big-btn-body">
            <div className="big-btn-title">{t.portfolioT}</div>
            <div className="big-btn-sub">{tPort.length} {lang==="ar"?"صفقات":"trades"} • ${PORT}</div>
          </div>
          <div className="big-btn-pnl" style={{color:clr(tPnlT)}}>
            {tPnlT>=0?"+":""}${Math.abs(tPnlT).toFixed(0)}
          </div>
          <div className="big-btn-arrow">›</div>
        </button>

        {/* Combined summary */}
        <div className="sec" style={{marginTop:4}}>{t.summary}</div>
        <div className="stat-grid">
          {[["Alpha P&L",(tPnlA>=0?"+":"")+"$"+Math.abs(tPnlA).toFixed(0),clr(tPnlA)],
            ["Turbo P&L",(tPnlT>=0?"+":"")+"$"+Math.abs(tPnlT).toFixed(0),clr(tPnlT)],
            ["Total",(tPnlA+tPnlT>=0?"+":"")+"$"+Math.abs(tPnlA+tPnlT).toFixed(0),clr(tPnlA+tPnlT)]
          ].map(([l,v,c])=>(
            <div key={l} className="stat-box">
              <div className="stat-num" style={{color:c,fontSize:15}}>{v}</div>
              <div className="stat-label">{l}</div>
            </div>
          ))}
        </div>

        <button className="big-btn" style={{marginTop:4}} onClick={fetchPrices}>
          <div className="big-btn-icon">🔄</div>
          <div className="big-btn-body">
            <div className="big-btn-title">{t.refresh}</div>
            {lastUpd&&<div className="big-btn-sub">{lastUpd.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"})}</div>}
          </div>
        </button>

        {err&&<div style={{background:"var(--redBg)",border:"1px solid #ff525230",borderRadius:12,padding:14,fontSize:12,color:"var(--red)",marginTop:8}}>
          ⚠ {t.err}: {err}
        </div>}
      </div>
    )}

    {/* ── ALPHA BOT ── */}
    {tab==="alpha"&&(
      <BotPage
        port={aPort} totalPnl={tPnlA} t={t} lang={lang} orange={false}
        title={t.botA_title} desc={t.botA_desc}
        doExport={fmt=>doExport(aPort,"ALPHA",fmt)}
      />
    )}

    {/* ── TURBO BOT ── */}
    {tab==="turbo"&&(
      <BotPage
        port={tPort} totalPnl={tPnlT} t={t} lang={lang} orange={true}
        title={t.botT_title} desc={t.botT_desc}
        doExport={fmt=>doExport(tPort,"TURBO",fmt)}
      />
    )}

    {/* ── SCANNER ── */}
    {tab==="scanner"&&(
      <div className="fade">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div className="sec" style={{margin:0,flex:1}}>LIVE PRICES</div>
          <button className="lang-btn" onClick={fetchPrices}>{loading?"…":t.refresh}</button>
        </div>
        {lastUpd&&<div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:12,color:"var(--mid)",display:"flex",justifyContent:"space-between"}}>
          <span>🕐 {lastUpd.toLocaleTimeString("en-US")}</span>
          <span style={{color:"var(--green)"}}>● LIVE</span>
        </div>}
        <div style={{overflowX:"auto",borderRadius:var_r,border:"1px solid var(--border)"}}>
          <table className="data-table" style={{minWidth:400,margin:0}}>
            <thead>
              <tr>
                <th>TICKER</th>
                <th>{lang==="ar"?"السعر":"PRICE"}</th>
                <th>{lang==="ar"?"التغير":"CHANGE"}</th>
                <th>{lang==="ar"?"عالي":"HIGH"}</th>
                <th>{lang==="ar"?"منخفض":"LOW"}</th>
                <th>VOL</th>
              </tr>
            </thead>
            <tbody>
              {ALL_TK.map(tk=>{
                const p=prices[tk];
                const chg=p?.price&&p?.prev?((p.price-p.prev)/p.prev*100):null;
                return(
                  <tr key={tk}>
                    <td style={{fontFamily:"var(--en)",fontWeight:900,color:"var(--white)",fontSize:14}}>{tk}</td>
                    <td style={{fontFamily:"var(--en)",fontWeight:900,fontSize:16,color:"var(--white)"}}>
                      {p?.price?"$"+p.price.toFixed(2):"—"}
                    </td>
                    <td style={{color:clr(chg),fontWeight:700,fontSize:14}}>
                      {chg!=null?fp(chg):"—"}
                    </td>
                    <td style={{color:"var(--mid)"}}>{p?.high?"$"+p.high.toFixed(2):"—"}</td>
                    <td style={{color:"var(--mid)"}}>{p?.low?"$"+p.low.toFixed(2):"—"}</td>
                    <td style={{color:"var(--dim)",fontSize:11}}>{p?.vol?(p.vol/1e6).toFixed(1)+"M":"—"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    )}

    {/* ── REPORTS ── */}
    {tab==="reports"&&(
      <div className="fade">
        <div className="robot-wrap" style={{padding:"10px 0 16px"}}>
          <Robot size={80}/>
        </div>

        <div className="sec">ALPHA BOT</div>
        {[[t.dlCSV,"📊","csv"],[t.dlJSON,"🗂","json"]].map(([lb,ic,fmt])=>(
          <button key={fmt} className="report-row" onClick={()=>doExport(aPort,"ALPHA",fmt)}>
            <span className="report-row-icon">{ic}</span>
            <div className="report-row-body">
              <div className="report-row-title">{t.alphaReport} — {fmt.toUpperCase()}</div>
              <div className="report-row-sub">{fmt==="csv"?"Excel / Numbers":"Developer format"}</div>
            </div>
            <span className="report-row-arrow">⬇</span>
          </button>
        ))}

        <div className="sep"/>
        <div className="sec">TURBO BOT</div>
        {[[t.dlCSV,"⚡","csv"],[t.dlJSON,"🗂","json"]].map(([lb,ic,fmt])=>(
          <button key={fmt} className="report-row" onClick={()=>doExport(tPort,"TURBO",fmt)}>
            <span className="report-row-icon">{ic}</span>
            <div className="report-row-body">
              <div className="report-row-title">{t.turboReport} — {fmt.toUpperCase()}</div>
              <div className="report-row-sub">{fmt==="csv"?"Excel / Numbers":"Developer format"}</div>
            </div>
            <span className="report-row-arrow">⬇</span>
          </button>
        ))}

        <div className="sep"/>
        <div className="sec">{lang==="ar"?"الكل":"COMBINED"}</div>
        <button className="report-row" onClick={()=>{
          const all=[...aPort.map(p=>({...p,bot:"ALPHA"})),...tPort.map(p=>({...p,bot:"TURBO"}))];
          exportCSV(all.map(p=>({Bot:p.bot,Ticker:p.ticker,Entry:p.entry,Stop:p.stop,T1:p.t1,T2:p.t2,Current:p.cur??"—",PnL:p.pnlUSD??"—",Pct:p.pnlPct??"—",Status:p.st,Alloc:p.amt})),`MAT_COMBINED_${new Date().toISOString().slice(0,10)}.csv`);
        }}>
          <span className="report-row-icon">📋</span>
          <div className="report-row-body">
            <div className="report-row-title">{t.fullReport}</div>
            <div className="report-row-sub">{lang==="ar"?"المحفظتين في ملف واحد":"Both portfolios in one file"}</div>
          </div>
          <span className="report-row-arrow">⬇</span>
        </button>

        <div className="card" style={{marginTop:8}}>
          <div className="sec">{t.summary}</div>
          {[
            [lang==="ar"?"محفظة ألفا":"Alpha Portfolio",PORT,tPnlA],
            [lang==="ar"?"محفظة تيربو":"Turbo Portfolio",PORT,tPnlT],
            [lang==="ar"?"الإجمالي":"Total",PORT*2,tPnlA+tPnlT],
          ].map(([lb,cap,pnl])=>(
            <div key={lb} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid var(--border)"}}>
              <span style={{fontSize:14,fontWeight:600}}>{lb}</span>
              <div style={{textAlign:"left"}}>
                <span style={{fontFamily:"var(--en)",fontSize:16,fontWeight:900,color:clr(pnl)}}>
                  {pnl>=0?"+":""}${Math.abs(pnl).toFixed(2)}
                </span>
                <span style={{fontSize:12,color:"var(--mid)",marginRight:8}}> ({fp(pnl/cap*100)})</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    )}

  </div>

  {/* BOTTOM NAV */}
  <div className="bnav">
    {NAV.map(({k,icon,lb})=>(
      <button key={k} className={`nav-item${tab===k?" on":""}`} onClick={()=>setTab(k)}>
        <div className="nav-icon">{icon}</div>
        <div className="nav-label">{lb}</div>
      </button>
    ))}
  </div>

  <div style={{height:"env(safe-area-inset-bottom,0px)"}}/>
</div>
