<!DOCTYPE html>

<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="M.A.T"/>
<meta name="theme-color" content="#080808"/>
<title>MOHANAD ALPHA TRADING</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Cairo:wght@500;700;900&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════
   VARIABLES
═══════════════════════════════════════════ */
:root {
  --bg:      #080808;
  --bg2:     #101010;
  --bg3:     #181818;
  --bg4:     #202020;
  --border:  #2a2a2a;
  --border2: #1a1a1a;
  --silver:  #c0c0c0;
  --silver2: #909090;
  --silver3: #585858;
  --white:   #f0f0f0;
  --red:     #cc0022;
  --red2:    #ff2244;
  --green:   #00cc44;
  --green2:  #00ff55;
  --yellow:  #ffcc00;
  --orange:  #ff6600;
  --mono:    'Share Tech Mono', monospace;
  --orb:     'Orbitron', monospace;
  --ar:      'Cairo', sans-serif;
  --radius:  12px;
  --radius2: 8px;
  --btn-h:   52px;
  --tab-h:   56px;
}

/* ═══════════════════════════════════════════
BASE
═══════════════════════════════════════════ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { background:var(–bg); color:var(–silver); font-family:var(–mono); min-height:100vh; overflow-x:hidden; }
button { cursor:pointer; border:none; outline:none; background:transparent; font-family:var(–mono); }
input  { outline:none; font-family:var(–mono); }
::-webkit-scrollbar { width:2px; height:2px; }
::-webkit-scrollbar-thumb { background:var(–border); border-radius:2px; }

/* ═══════════════════════════════════════════
ANIMATIONS
═══════════════════════════════════════════ */
@keyframes spin    { to { transform:rotate(360deg) } }
@keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.25} }
@keyframes fadein  { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes float   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
@keyframes glow    { 0%,100%{box-shadow:0 0 10px rgba(192,192,192,.15)} 50%{box-shadow:0 0 22px rgba(192,192,192,.3)} }
@keyframes ticker  { 0%{transform:translateX(100%)} 100%{transform:translateX(-300%)} }
@keyframes glitch  { 0%,88%,100%{transform:none;filter:none} 90%{transform:skewX(-2deg);filter:hue-rotate(60deg)} 93%{transform:skewX(2deg) translateX(3px)} 96%{transform:none;filter:none} }
@keyframes scan    { 0%{top:-5%} 100%{top:105%} }
@keyframes bootln  { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:none} }
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
@keyframes popIn   { 0%{transform:scale(.94);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes eye     { 0%,88%,100%{transform:scaleY(1)} 91%{transform:scaleY(.06)} }

body::after {
content:’’; position:fixed; inset:0;
background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px);
pointer-events:none; z-index:9998;
}

/* ═══════════════════════════════════════════
HEADER
═══════════════════════════════════════════ */
.hdr {
background:linear-gradient(180deg,#050505,var(–bg));
border-bottom:1px solid var(–border2);
padding:14px 18px;
padding-top:max(14px,env(safe-area-inset-top));
position:sticky; top:0; z-index:200;
backdrop-filter:blur(10px);
}
.hdr-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.logo-area { display:flex; align-items:center; gap:13px; flex:1; min-width:0; }
.logo-box {
width:50px; height:50px; border:1px solid var(–silver3); border-radius:10px;
display:flex; align-items:center; justify-content:center;
background:var(–bg2); flex-shrink:0; animation:glow 4s infinite;
position:relative; overflow:hidden;
}
.logo-box::after {
content:’’; position:absolute; inset:0;
background:linear-gradient(135deg,transparent 40%,rgba(192,192,192,.06) 50%,transparent 60%);
background-size:200% 100%; animation:shimmer 4s infinite;
}
.mat-title { font-family:var(–orb); font-size:13px; font-weight:900; color:var(–white); letter-spacing:1px; animation:glitch 10s infinite; }
.mat-sub   { font-size:9px; color:var(–silver3); letter-spacing:1.5px; margin-top:2px; }
.hdr-right { text-align:left; flex-shrink:0; }
.clock     { font-family:var(–orb); font-size:15px; font-weight:700; color:var(–white); line-height:1; }
.mkt-pill  {
display:inline-flex; align-items:center; gap:5px; padding:4px 10px;
border-radius:20px; font-size:9px; letter-spacing:.8px; margin-top:4px;
border:1px solid; font-family:var(–mono);
}
.mkt-open   { color:var(–green2); border-color:#00cc4440; background:#00cc4410; }
.mkt-closed { color:var(–red2);   border-color:#ff224440; background:#ff224410; }
.live-dot   { width:6px; height:6px; border-radius:50%; animation:pulse 1.5s infinite; }

/* ═══════════════════════════════════════════
TICKER BAR
═══════════════════════════════════════════ */
.ticker-bar { background:var(–bg2); border-bottom:1px solid var(–border2); padding:7px 0; overflow:hidden; white-space:nowrap; }
.ticker-track { display:inline-block; animation:ticker 50s linear infinite; font-size:11px; letter-spacing:.5px; }

/* ═══════════════════════════════════════════
LANGUAGE TOGGLE
═══════════════════════════════════════════ */
.lang-btn {
padding:8px 14px; border:1px solid var(–border); border-radius:20px;
font-size:11px; color:var(–silver); transition:all .2s; flex-shrink:0;
}
.lang-btn:hover, .lang-btn:active { border-color:var(–silver3); background:var(–bg3); color:var(–white); }

/* ═══════════════════════════════════════════
BOTTOM NAV TABS (big, mobile-friendly)
═══════════════════════════════════════════ */
.bottom-nav {
position:fixed; bottom:0; left:0; right:0; z-index:200;
background:var(–bg2); border-top:1px solid var(–border2);
display:flex; padding-bottom:env(safe-area-inset-bottom,0px);
backdrop-filter:blur(12px);
}
.nav-btn {
flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
padding:10px 4px; gap:4px; transition:all .2s;
color:var(–silver3); font-size:8px; letter-spacing:.5px; min-height:var(–tab-h);
}
.nav-btn.active { color:var(–white); }
.nav-btn.active .nav-icon { color:var(–white); }
.nav-icon { font-size:22px; line-height:1; }
.nav-label { font-size:8px; letter-spacing:.5px; text-transform:uppercase; font-family:var(–mono); }
.nav-indicator {
position:absolute; top:0; left:10%; right:10%; height:2px;
background:var(–silver); border-radius:0 0 2px 2px;
opacity:0; transition:opacity .2s;
}
.nav-btn.active .nav-indicator { opacity:1; }

/* ═══════════════════════════════════════════
MAIN CONTENT
═══════════════════════════════════════════ */
.main { padding:16px 16px 90px; }
.fade { animation:fadein .3s ease both; }
.pop  { animation:popIn .3s cubic-bezier(.34,1.56,.64,1) both; }

/* ═══════════════════════════════════════════
SECTION TITLE
═══════════════════════════════════════════ */
.sec-title {
font-size:10px; color:var(–silver3); letter-spacing:3px; margin-bottom:14px;
text-transform:uppercase; display:flex; align-items:center; gap:10px;
}
.sec-title::after { content:’’; flex:1; height:1px; background:var(–border2); }

/* ═══════════════════════════════════════════
CARDS
═══════════════════════════════════════════ */
.card {
background:var(–bg2); border:1px solid var(–border);
border-radius:var(–radius); padding:18px; margin-bottom:14px;
transition:border-color .2s, transform .15s;
}
.card:active { transform:scale(.99); }
.card-sm { padding:14px; border-radius:var(–radius2); margin-bottom:10px; }

/* ═══════════════════════════════════════════
BIG ACTION BUTTONS
═══════════════════════════════════════════ */
.btn-primary {
display:flex; align-items:center; justify-content:center; gap:10px;
width:100%; height:var(–btn-h); border-radius:var(–radius);
font-size:15px; font-weight:700; letter-spacing:.5px;
transition:all .18s; font-family:var(–ar);
}
.btn-primary:active { transform:scale(.97); }

.btn-silver {
background:linear-gradient(135deg,#1a1a1a,#222);
color:var(–white); border:1px solid var(–silver3);
}
.btn-silver:hover { background:linear-gradient(135deg,#252525,#2a2a2a); border-color:var(–silver); }

.btn-outline {
background:transparent; color:var(–silver); border:1px solid var(–border);
}
.btn-outline:hover { border-color:var(–silver3); color:var(–white); background:var(–bg3); }

.btn-green {
background:linear-gradient(135deg,#003315,#004d1f);
color:var(–green2); border:1px solid #00cc4430;
}
.btn-red {
background:linear-gradient(135deg,#1a0008,#220010);
color:var(–red2); border:1px solid #ff224430;
}
.btn-orange {
background:linear-gradient(135deg,#1a0800,#220e00);
color:var(–orange); border:1px solid #ff660030;
}

.btn-sm {
height:40px; font-size:12px; border-radius:var(–radius2);
padding:0 16px; display:inline-flex; align-items:center; gap:6px;
border:1px solid var(–border); color:var(–silver); transition:all .2s;
}
.btn-sm:hover, .btn-sm:active { border-color:var(–silver3); background:var(–bg3); }

/* ═══════════════════════════════════════════
BADGES
═══════════════════════════════════════════ */
.badge {
display:inline-flex; align-items:center; gap:4px; padding:5px 12px;
border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.3px;
font-family:var(–mono);
}
.badge-green  { background:#00cc4415; color:var(–green2);  border:1px solid #00cc4435; }
.badge-red    { background:#ff224415; color:var(–red2);    border:1px solid #ff224435; }
.badge-yellow { background:#ffcc0015; color:var(–yellow);  border:1px solid #ffcc0035; }
.badge-silver { background:#c0c0c015; color:var(–silver);  border:1px solid #c0c0c035; }
.badge-orange { background:#ff660015; color:var(–orange);  border:1px solid #ff660035; }
.badge-lg     { padding:8px 18px; font-size:13px; }

/* ═══════════════════════════════════════════
DATA ROWS
═══════════════════════════════════════════ */
.drow { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(–border2); }
.drow:last-child { border-bottom:none; }
.drow-label { color:var(–silver3); font-size:12px; }
.drow-val   { font-weight:700; font-size:13px; font-family:var(–mono); }

/* ═══════════════════════════════════════════
GRID LAYOUTS
═══════════════════════════════════════════ */
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.g3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }

/* ═══════════════════════════════════════════
STAT CARD
═══════════════════════════════════════════ */
.stat-card {
background:var(–bg2); border:1px solid var(–border); border-radius:var(–radius2);
padding:16px 12px; text-align:center;
}
.stat-num  { font-family:var(–orb); font-size:20px; font-weight:900; margin-bottom:4px; }
.stat-lbl  { font-size:9px; color:var(–silver3); letter-spacing:1.5px; text-transform:uppercase; }
.stat-sub  { font-size:10px; color:var(–silver3); margin-top:3px; font-family:var(–ar); }

/* ═══════════════════════════════════════════
PORTFOLIO HERO
═══════════════════════════════════════════ */
.port-hero {
border-radius:16px; padding:24px 20px; margin-bottom:16px; text-align:center;
background:var(–bg2); border:1px solid var(–border);
position:relative; overflow:hidden;
}
.port-hero::before {
content:’’; position:absolute; inset:0;
background:radial-gradient(ellipse at 50% 0%, rgba(192,192,192,.04), transparent 70%);
}
.port-amount { font-family:var(–orb); font-size:38px; font-weight:900; color:var(–white); line-height:1; }
.port-pnl    { font-size:18px; margin-top:8px; font-family:var(–mono); }
.port-label  { font-size:10px; color:var(–silver3); letter-spacing:2px; margin-top:6px; text-transform:uppercase; }

/* ═══════════════════════════════════════════
TRADE CARD
═══════════════════════════════════════════ */
.trade-card {
background:var(–bg2); border:1px solid var(–border); border-radius:var(–radius);
padding:18px; margin-bottom:12px; transition:all .2s;
}
.trade-card:hover { border-color:var(–silver3); }
.trade-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
.trade-ticker { font-family:var(–orb); font-size:22px; font-weight:900; color:var(–white); }
.trade-name   { font-size:11px; color:var(–silver3); margin-top:2px; font-family:var(–ar); }
.trade-price  { font-family:var(–orb); font-size:20px; font-weight:900; color:var(–white); text-align:left; }
.trade-chg    { font-size:12px; text-align:left; margin-top:2px; }

/* PROGRESS BAR */
.progress-wrap { margin-top:14px; }
.progress-labels { display:flex; justify-content:space-between; font-size:9px; color:var(–silver3); margin-bottom:5px; }
.progress-track { height:8px; background:var(–bg3); border-radius:4px; position:relative; overflow:visible; }
.progress-fill  { height:100%; border-radius:4px; transition:width .8s ease; }
.progress-marker {
position:absolute; top:-3px; bottom:-3px; width:4px; border-radius:2px;
transform:translateX(-50%); transition:left .8s ease;
box-shadow:0 0 8px currentColor;
}

/* PNL BAR */
.pnl-bar  { height:4px; border-radius:2px; margin-top:10px; background:var(–bg3); overflow:hidden; }
.pnl-fill { height:100%; border-radius:2px; transition:width .8s ease; }

/* ═══════════════════════════════════════════
TABLE
═══════════════════════════════════════════ */
.tbl { width:100%; border-collapse:collapse; }
.tbl th { padding:10px 10px; background:var(–bg3); color:var(–silver3); border-bottom:1px solid var(–border); text-align:right; font-size:10px; letter-spacing:.5px; white-space:nowrap; }
.tbl td { padding:11px 10px; border-bottom:1px solid var(–border2); font-size:12px; }
.tbl tr:hover td { background:var(–bg3); }
.tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(–radius2); border:1px solid var(–border); }

/* ═══════════════════════════════════════════
ALERT / NOTE
═══════════════════════════════════════════ */
.alert {
border-radius:var(–radius2); padding:14px 16px; margin-bottom:14px;
font-size:12px; display:flex; gap:10px; align-items:flex-start; line-height:1.6;
}
.alert-warn   { background:#0d0700; border:1px solid #2a1800; color:#ff9933; }
.alert-info   { background:#050a0d; border:1px solid #0a2030; color:var(–silver2); }
.alert-error  { background:#0d0004; border:1px solid #2a0010; color:var(–red2); }

/* ═══════════════════════════════════════════
MR ROBOT CHARACTER
═══════════════════════════════════════════ */
.robot-hero { display:flex; flex-direction:column; align-items:center; padding:20px 0 10px; }

/* ═══════════════════════════════════════════
REPORT SECTION
═══════════════════════════════════════════ */
.report-btn {
display:flex; align-items:center; gap:12px; padding:16px 18px;
background:var(–bg2); border:1px solid var(–border); border-radius:var(–radius);
margin-bottom:10px; width:100%; text-align:right; color:var(–silver);
transition:all .2s; font-family:var(–ar); font-size:14px;
}
.report-btn:hover,.report-btn:active { border-color:var(–silver3); background:var(–bg3); color:var(–white); }
.report-icon { font-size:24px; flex-shrink:0; }
.report-arrow { margin-right:auto; color:var(–silver3); font-size:16px; flex-shrink:0; }

/* ═══════════════════════════════════════════
LOADER
═══════════════════════════════════════════ */
.loader-screen {
display:flex; flex-direction:column; align-items:center;
justify-content:center; min-height:100vh; gap:22px; background:var(–bg); padding:20px;
}
.loader-ring {
width:54px; height:54px; border:2px solid var(–border); border-top:2px solid var(–silver);
border-radius:50%; animation:spin .9s linear infinite;
box-shadow:0 0 20px rgba(192,192,192,.15);
}
.boot-terminal {
width:100%; max-width:380px; background:var(–bg2); border:1px solid var(–border);
border-radius:var(–radius); padding:18px; font-size:11px; font-family:var(–mono);
}
.bootln { color:var(–silver3); margin-bottom:4px; animation:bootln .2s ease both; }
.bootln.g { color:var(–green); }
.bootln.r { color:var(–red2); }
.bootln.s { color:var(–silver); }

/* ═══════════════════════════════════════════
SEPARATOR
═══════════════════════════════════════════ */
.sep { height:1px; background:var(–border2); margin:12px 0; }

/* ═══════════════════════════════════════════
EMPTY STATE
═══════════════════════════════════════════ */
.empty-state { text-align:center; padding:50px 20px; }
.empty-icon  { font-size:48px; margin-bottom:16px; opacity:.5; }
.empty-text  { color:var(–silver3); font-size:13px; font-family:var(–ar); }
</style>

</head>

const fD   = (d,lang) => d.toLocaleDateString(lang==="ar"?"ar-SA":"en-US",{weekday:"short",month:"short",day:"numeric"});
const fmt$ = n  => n==null ? "—" : "$"+Number(n).toFixed(2);
const fp   = n  => n==null ? "—" : (n>=0?"+":"")+n.toFixed(2)+"%";
const clr  = n  => n==null?"#666":n>=0?"var(--green2)":"var(--red2)";

const PROXY = "https://api.allorigins.win/get?url=";
const YF    = "https://query1.finance.yahoo.com/v8/finance/chart/";

async function fetchPrice(ticker) {
  try {
    const url  = encodeURIComponent(`${YF}${ticker}?interval=1m&range=1d`);
    const resp = await fetch(PROXY+url, { signal:AbortSignal.timeout(9000) });
    if (!resp.ok) throw new Error("proxy error");
    const data = JSON.parse((await resp.json()).contents);
    const meta = data?.chart?.result?.[0]?.meta;
    if (!meta) throw new Error("no meta");
    return {
      ticker, price:meta.regularMarketPrice,
      prev:meta.chartPreviousClose||meta.previousClose,
      high:meta.regularMarketDayHigh, low:meta.regularMarketDayLow,
      volume:meta.regularMarketVolume,
    };
  } catch { return { ticker, price:null }; }
}

async function fetchAll() {
  const res = await Promise.allSettled(ALL_TICKERS.map(fetchPrice));
  const map = {};
  res.forEach(r => { if (r.status==="fulfilled"&&r.value) map[r.value.ticker]=r.value; });
  return map;
}

function calcPort(setups, prices, portSize) {
  return setups.map((s,i) => {
    const p   = prices[s.ticker];
    const cur = p?.price;
    const pct = s.alloc;
    const amt = Math.round(portSize * pct / 100);
    const shr = cur ? +(amt / s.entry).toFixed(3) : null;
    let pnlUSD=null, pnlPct=null, st="PENDING";
    if (cur && shr) {
      pnlUSD = +((cur-s.entry)*shr).toFixed(2);
      pnlPct = +((cur-s.entry)/s.entry*100).toFixed(2);
      if (cur <= s.stop)           st = "STOPPED";
      else if (cur >= s.target2)   st = "TARGET2";
      else if (cur >= s.target)    st = "TARGET1";
      else if (pnlPct > 0.5)       st = "PROFIT";
      else if (pnlPct < -0.5)      st = "LOSS";
      else                         st = "FLAT";
    }
    const dayChg    = (cur&&p.prev) ? ((cur-p.prev)/p.prev*100) : null;
    const maxProfit = +((s.target-s.entry)/s.entry*100).toFixed(1);
    const rr        = +((s.target-s.entry)/(s.entry-s.stop)).toFixed(2);
    const toTarget  = cur ? +((s.target-cur)/cur*100).toFixed(2) : null;
    return { ...s, cur, amt, shr, pnlUSD, pnlPct, st, dayChg, maxProfit, rr, toTarget };
  });
}

/* ════════════════════════════════════════
   CSV / JSON EXPORT
════════════════════════════════════════ */
function exportCSV(rows, filename) {
  const keys  = Object.keys(rows[0]);
  const lines = [keys.join(","), ...rows.map(r => keys.map(k => `"${r[k]??""}"` ).join(","))];
  const blob  = new Blob([lines.join("\n")], { type:"text/csv;charset=utf-8;" });
  const url   = URL.createObjectURL(blob);
  const a     = document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function exportJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data,null,2)], { type:"application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a"); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

              {[
                {label:t.bot_alpha_name, pnl:tPnlA, col:"var(--silver)", icon:"🤖"},
                {label:t.bot_turbo_name, pnl:tPnlT, col:"var(--orange)", icon:"⚡"},
              ].map(({label,pnl,col,icon})=>(
                <div key={label} className="stat-card" style={{textAlign:"center"}}>
                  <div style={{fontSize:24,marginBottom:6}}>{icon}</div>
                  <div style={{fontFamily:"var(--orb)",fontSize:10,color:col,letterSpacing:1,marginBottom:8}}>{label}</div>
                  <div style={{fontFamily:"var(--orb)",fontSize:20,fontWeight:900,color:clr(pnl)}}>
                    {pnl>=0?"+":""}${Math.abs(pnl).toFixed(0)}
                  </div>
                  <div style={{fontSize:11,color:clr(pnl/PORT*100),marginTop:3}}>{fp(pnl/PORT*100)}</div>
                  <div className="pnl-bar" style={{marginTop:8}}>
                    <div className="pnl-fill" style={{width:Math.min(100,Math.abs(pnl/PORT*100)*6)+"%",background:pnl>=0?"var(--green)":"var(--red2)"}}/>
                  </div>
                </div>
              ))}
            </div>

            {/* Quick action buttons */}
            <div className="sec-title">{t.positions}</div>
            <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
              <button className="btn-primary btn-silver" onClick={()=>setTab("alpha")}>
                🤖 {t.bot_alpha_name} — ${PORT}
                <span style={{marginRight:"auto",fontSize:13,color:clr(tPnlA)}}>{tPnlA>=0?"+":""}${Math.abs(tPnlA).toFixed(0)}</span>
                <span style={{color:"var(--silver3)",fontSize:12}}>›</span>
              </button>
              <button className="btn-primary btn-orange" onClick={()=>setTab("turbo")}>
                ⚡ {t.bot_turbo_name} — ${PORT}
                <span style={{marginRight:"auto",fontSize:13,color:clr(tPnlT)}}>{tPnlT>=0?"+":""}${Math.abs(tPnlT).toFixed(0)}</span>
                <span style={{color:"var(--silver3)",fontSize:12}}>›</span>
              </button>
              <button className="btn-primary btn-outline" onClick={fetchPrices}>
                ⟳ {t.refresh}
                {lastUpd&&<span style={{marginRight:"auto",fontSize:10,color:"var(--silver3)"}}>
                  {lastUpd.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"})}
                </span>}
              </button>
            </div>

            {error && (
              <div className="alert alert-error">⚠ {t.priceError}: {error}</div>
            )}
          </div>
        )}

        {/* ─── ALPHA BOT ─── */}
        {tab==="alpha" && (
          <div className="fade">
            <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:16}}>
              <RobotFigure size={72} silver/>
              <div style={{flex:1}}>
                <div style={{fontFamily:"var(--orb)",fontSize:16,fontWeight:900,color:"var(--white)"}}>{t.bot_alpha_name}</div>
                <div style={{fontSize:11,color:"var(--silver3)",marginTop:4,fontFamily:"var(--ar)",lineHeight:1.7}}>{t.bot_alpha_desc}</div>
                <div style={{display:"flex",alignItems:"center",gap:6,fontSize:9,color:"var(--green2)",marginTop:6,letterSpacing:1}}>
                  <span style={{width:6,height:6,borderRadius:"50%",background:"var(--green2)",display:"inline-block",animation:"pulse 2s infinite"}}/>
                  ONLINE — {t.moderate.toUpperCase()} RISK
                </div>
              </div>
            </div>

            {/* Portfolio hero */}
            <div className="port-hero">
              <div className="port-label">{t.portfolioCapital}</div>
              <div className="port-amount">${PORT}</div>
              <div className="port-pnl" style={{color:clr(tPnlA)}}>
                {tPnlA>=0?"+":""}${Math.abs(tPnlA).toFixed(2)} ({fp(tPnlA/PORT*100)})
              </div>
              <div className="port-label" style={{marginTop:8}}>ALPHA STRATEGY • MODERATE RISK • SWING 3–14 DAYS</div>
            </div>

            {/* Filter tabs */}
            <div style={{display:"flex",gap:8,marginBottom:14}}>
              {[["all",t.allTrades],["open",t.openTrades],["closed",t.closedTrades]].map(([k,label])=>(
                <button key={k} onClick={()=>setFilter(k)}
                  style={{flex:1,height:40,borderRadius:8,fontSize:11,
                    background:filter===k?"var(--bg3)":"transparent",
                    color:filter===k?"var(--white)":"var(--silver3)",
                    border:`1px solid ${filter===k?"var(--silver3)":"var(--border)"}`,
                    fontFamily:"var(--ar)",transition:"all .2s"}}>
                  {label}
                </button>
              ))}
            </div>

            {alphaPort
              .filter(p=>filter==="all"||(filter==="open"&&p.st!=="STOPPED"&&p.st!=="TARGET1"&&p.st!=="TARGET2")||(filter==="closed"&&(p.st==="STOPPED"||p.st==="TARGET1"||p.st==="TARGET2")))
              .map(p=><TradeCard key={p.ticker} p={p} t={t} isOrange={false}/>)
            }

            {/* Summary */}
            <div className="g3">
              {[
                [t.maxGain,  "+$"+alphaPort.reduce((s,p)=>s+Math.round(p.amt*p.maxProfit/100),0), "var(--green2)"],
                [t.maxLoss,  "-$"+alphaPort.reduce((s,p)=>s+Math.round(p.amt*p.risk_pct/100),0), "var(--red2)"],
                [t.currentPnl, (tPnlA>=0?"+":"")+"$"+Math.abs(tPnlA).toFixed(0), clr(tPnlA)],
              ].map(([l,v,c])=>(
                <div key={l} className="stat-card" style={{padding:12}}>
                  <div className="stat-num" style={{color:c,fontSize:16}}>{v}</div>
                  <div className="stat-lbl" style={{fontSize:8}}>{l}</div>
                </div>
              ))}
            </div>

            {/* Download buttons */}
            <div style={{display:"flex",gap:10,marginTop:6}}>
              <button className="btn-sm" style={{flex:1}} onClick={()=>doExport(alphaPort,"ALPHA_BOT","csv")}>📥 CSV</button>
              <button className="btn-sm" style={{flex:1}} onClick={()=>doExport(alphaPort,"ALPHA_BOT","json")}>📥 JSON</button>
            </div>
          </div>
        )}

        {/* ─── TURBO BOT ─── */}
        {tab==="turbo" && (
          <div className="fade">
            <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:16}}>
              <RobotFigure size={72} silver={false}/>
              <div style={{flex:1}}>
                <div style={{fontFamily:"var(--orb)",fontSize:16,fontWeight:900,color:"var(--orange)"}}>{t.bot_turbo_name}</div>
                <div style={{fontSize:11,color:"var(--silver3)",marginTop:4,fontFamily:"var(--ar)",lineHeight:1.7}}>{t.bot_turbo_desc}</div>
                <div style={{display:"flex",alignItems:"center",gap:6,fontSize:9,color:"var(--orange)",marginTop:6,letterSpacing:1}}>
                  <span style={{width:6,height:6,borderRadius:"50%",background:"var(--orange)",display:"inline-block",animation:"pulse .8s infinite"}}/>
                  ONLINE — {t.aggressive.toUpperCase()} RISK
                </div>
              </div>
            </div>

            <div className="alert alert-warn" style={{fontFamily:"var(--ar)"}}>
              ⚡ {lang==="ar"?"وضع المخاطرة العالية — Turbo Bot يختار أعلى فرص الكسب بأسرع وقت، تخصيص أعلى لكل صفقة.":"High risk mode — Turbo Bot selects max-yield setups with higher allocation per trade."}
            </div>

            <div className="port-hero" style={{borderColor:"#2a1500"}}>
              <div className="port-label">{t.portfolioCapital}</div>
              <div className="port-amount" style={{color:"var(--orange)"}}>${PORT}</div>
              <div className="port-pnl" style={{color:clr(tPnlT)}}>
                {tPnlT>=0?"+":""}${Math.abs(tPnlT).toFixed(2)} ({fp(tPnlT/PORT*100)})
              </div>
              <div className="port-label" style={{marginTop:8}}>TURBO STRATEGY • HIGH RISK • MAX CAPITAL GROWTH</div>
            </div>

            {/* Filter tabs */}
            <div style={{display:"flex",gap:8,marginBottom:14}}>
              {[["all",t.allTrades],["open",t.openTrades],["closed",t.closedTrades]].map(([k,label])=>(
                <button key={k} onClick={()=>setFilter(k)}
                  style={{flex:1,height:40,borderRadius:8,fontSize:11,
                    background:filter===k?"var(--bg3)":"transparent",
                    color:filter===k?"var(--white)":"var(--silver3)",
                    border:`1px solid ${filter===k?"#2a1500":"var(--border)"}`,
                    fontFamily:"var(--ar)",transition:"all .2s"}}>
                  {label}
                </button>
              ))}
            </div>

            {turboPort
              .filter(p=>filter==="all"||(filter==="open"&&p.st!=="STOPPED"&&p.st!=="TARGET1"&&p.st!=="TARGET2")||(filter==="closed"&&(p.st==="STOPPED"||p.st==="TARGET1"||p.st==="TARGET2")))
              .map(p=><TradeCard key={p.ticker} p={p} t={t} isOrange={true}/>)
            }

            <div className="g3">
              {[
                [t.maxGain,  "+$"+turboPort.reduce((s,p)=>s+Math.round(p.amt*p.maxProfit/100),0), "var(--green2)"],
                [t.maxLoss,  "-$"+turboPort.reduce((s,p)=>s+Math.round(p.amt*p.risk_pct/100),0), "var(--red2)"],
                [t.currentPnl, (tPnlT>=0?"+":"")+"$"+Math.abs(tPnlT).toFixed(0), clr(tPnlT)],
              ].map(([l,v,c])=>(
                <div key={l} className="stat-card" style={{padding:12}}>
                  <div className="stat-num" style={{color:c,fontSize:16}}>{v}</div>
                  <div className="stat-lbl" style={{fontSize:8}}>{l}</div>
                </div>
              ))}
            </div>

            <div style={{display:"flex",gap:10,marginTop:6}}>
              <button className="btn-sm" style={{flex:1}} onClick={()=>doExport(turboPort,"TURBO_BOT","csv")}>📥 CSV</button>
              <button className="btn-sm" style={{flex:1}} onClick={()=>doExport(turboPort,"TURBO_BOT","json")}>📥 JSON</button>
            </div>
          </div>
        )}

        {/* ─── SCANNER ─── */}
        {tab==="scanner" && (
          <div className="fade">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <div className="sec-title" style={{margin:0,flex:1}}>LIVE PRICES</div>
              <button className="btn-sm" onClick={fetchPrices}>{loading?"⟳...":"⟳ "+t.refresh}</button>
            </div>

            {lastUpd&&<div className="alert alert-info" style={{marginBottom:12,padding:"8px 14px",fontSize:10}}>
              🕐 {lang==="ar"?"آخر تحديث:":"Last update:"} {lastUpd.toLocaleTimeString("en-US")}
              <span style={{marginRight:8,color:"var(--green2)"}}>● {t.liveData}</span>
            </div>}

            <div className="tbl-wrap">
              <table className="tbl" style={{minWidth:420}}>
                <thead>
                  <tr>{[lang==="ar"?"السهم":"Ticker",lang==="ar"?"السعر":"Price",lang==="ar"?"التغير":"Change",lang==="ar"?"عالي":"High",lang==="ar"?"منخفض":"Low","Volume"].map(h=><th key={h}>{h}</th>)}</tr>
                </thead>
                <tbody>
                  {ALL_TICKERS.map(tk=>{
                    const p=prices[tk];
                    const chg=p?.price&&p?.prev?((p.price-p.prev)/p.prev*100):null;
                    return (
                      <tr key={tk}>
                        <td style={{fontFamily:"var(--orb)",fontWeight:900,color:"var(--white)",fontSize:13}}>{tk}</td>
                        <td style={{color:"var(--white)",fontWeight:700,fontSize:14,fontFamily:"var(--mono)"}}>{fmt$(p?.price)}</td>
                        <td style={{color:clr(chg),fontWeight:700}}>{chg!=null?fp(chg):"—"}</td>
                        <td style={{color:"var(--silver3)",fontSize:11}}>{fmt$(p?.high)}</td>
                        <td style={{color:"var(--silver3)",fontSize:11}}>{fmt$(p?.low)}</td>
                        <td style={{color:"var(--silver3)",fontSize:10}}>{p?.volume?(p.volume/1e6).toFixed(1)+"M":"—"}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {error&&<div className="alert alert-error" style={{marginTop:12}}>⚠ {t.priceError}: {error}</div>}
          </div>
        )}

        {/* ─── REPORTS ─── */}
        {tab==="reports" && (
          <div className="fade">
            <div className="robot-hero" style={{padding:"10px 0 16px"}}>
              <RobotFigure size={80} silver/>
            </div>

            <div className="sec-title">{t.alphaReport}</div>
            <button className="report-btn" onClick={()=>doExport(alphaPort,"ALPHA_BOT","csv")}>
              <span className="report-icon">📊</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontFamily:"var(--ar)"}}>{t.alphaReport} — CSV</div>
                <div style={{fontSize:10,color:"var(--silver3)",marginTop:2}}>Excel / Numbers compatible</div>
              </div>
              <span className="report-arrow">⬇</span>
            </button>
            <button className="report-btn" onClick={()=>doExport(alphaPort,"ALPHA_BOT","json")}>
              <span className="report-icon">🗂</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontFamily:"var(--ar)"}}>{t.alphaReport} — JSON</div>
                <div style={{fontSize:10,color:"var(--silver3)",marginTop:2}}>Developer format</div>
              </div>
              <span className="report-arrow">⬇</span>
            </button>

            <div className="sep"/>
            <div className="sec-title">{t.turboReport}</div>
            <button className="report-btn" onClick={()=>doExport(turboPort,"TURBO_BOT","csv")}>
              <span className="report-icon">⚡</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontFamily:"var(--ar)"}}>{t.turboReport} — CSV</div>
                <div style={{fontSize:10,color:"var(--silver3)",marginTop:2}}>Excel / Numbers compatible</div>
              </div>
              <span className="report-arrow">⬇</span>
            </button>
            <button className="report-btn" onClick={()=>doExport(turboPort,"TURBO_BOT","json")}>
              <span className="report-icon">🗂</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontFamily:"var(--ar)"}}>{t.turboReport} — JSON</div>
                <div style={{fontSize:10,color:"var(--silver3)",marginTop:2}}>Developer format</div>
              </div>
              <span className="report-arrow">⬇</span>
            </button>

            <div className="sep"/>
            <div className="sec-title">{t.fullReport}</div>
            <button className="report-btn" onClick={()=>{
              const all=[...alphaPort.map(p=>({...p,bot:"ALPHA"})),...turboPort.map(p=>({...p,bot:"TURBO"}))];
              exportCSV(all.map(p=>({Bot:p.bot,Ticker:p.ticker,Entry:p.entry,Stop:p.stop,Target:p.target,CurrentPrice:p.cur??"—",PnLUSD:p.pnlUSD??"—",PnLPct:p.pnlPct??"—",Status:p.st,Alloc:p.amt})),`MAT_FULL_${new Date().toISOString().slice(0,10)}.csv`);
            }}>
              <span className="report-icon">📋</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontFamily:"var(--ar)"}}>كل المحافظ — تقرير موحد</div>
                <div style={{fontSize:10,color:"var(--silver3)",marginTop:2}}>{t.alphaReport} + {t.turboReport}</div>
              </div>
              <span className="report-arrow">⬇</span>
            </button>

            {/* Summary table */}
            <div className="sep"/>
            <div className="sec-title">{t.summary}</div>
            <div className="card">
              {[
                [lang==="ar"?"محفظة ألفا":"Alpha Portfolio", PORT, tPnlA],
                [lang==="ar"?"محفظة تيربو":"Turbo Portfolio", PORT, tPnlT],
                [lang==="ar"?"الإجمالي":"Total", PORT*2, tPnlA+tPnlT],
              ].map(([label,cap,pnl])=>(
                <div key={label} className="drow">
                  <span className="drow-label" style={{fontFamily:"var(--ar)"}}>{label}</span>
                  <div style={{textAlign:"left"}}>
                    <span className="drow-val" style={{color:clr(pnl)}}>{pnl>=0?"+":""}${Math.abs(pnl).toFixed(2)}</span>
                    <span style={{fontSize:10,color:"var(--silver3)",marginRight:8}}> ({fp(pnl/cap*100)})</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

      </div>

      {/* ══════════ BOTTOM NAV ══════════ */}
      <div className="bottom-nav">
        {NAV.map(({k,icon,label})=>(
          <button key={k} className={`nav-btn ${tab===k?"active":""}`} onClick={()=>setTab(k)} style={{position:"relative"}}>
            <div className="nav-indicator"/>
            <div className="nav-icon">{icon}</div>
            <div className="nav-label">{label}</div>
          </button>
        ))}
      </div>

      <div style={{height:"env(safe-area-inset-bottom,0px)"}}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
